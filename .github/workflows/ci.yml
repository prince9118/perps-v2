name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Bundle backend services
        run: |
          for app in api ws engine db-worker price-service funding-service liquidator; do
            echo "::group::$app"
            bun build "apps/$app/src/index.ts" --target=bun --outdir="/tmp/bundle/$app"
            echo "::endgroup::"
          done

      - name: Build web
        working-directory: apps/web
        run: bunx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
